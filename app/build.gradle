plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

// 签名信息读取顺序:根目录 local.properties(本机/AndroidIDE) → -P 项目属性 → 同名环境变量。
// 该 properties 文件已在 .gitignore 中,密码与别名不入库;CI 云编译用 -P 参数传入 GitHub Secrets。
// 三者都没有时 hasReleaseSigning 为 false,release 会退回 debug 签名并在构建日志里警告。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
  // 必须用 UTF-8 读:Properties.load(InputStream) 默认按 ISO-8859-1 解码,
  // 一旦签名文件路径里含中文就会读成乱码,导致签名被静默回退成 debug key。
  localPropsFile.withReader('UTF-8') { localProps.load(it) }
}
def signingProp = { String name ->
  def v = localProps.getProperty(name)
  // 其次是 -P 项目属性:Gradle daemon 是长驻进程,System.getenv 只能看到 daemon 启动时的环境,
  // 客户端临时设的环境变量它读不到,所以 CI 也支持用 -PRELEASE_XXX=... 传入。
  if (v == null || v.trim().isEmpty()) {
    v = findProperty(name)
  }
  if (v == null || v.trim().isEmpty()) {
    v = System.getenv(name)
  }
  (v != null && !v.toString().trim().isEmpty()) ? v.toString().trim() : null
}
def relStoreFilePath = signingProp('RELEASE_STORE_FILE') ?: 'my-release.jks'
def relStoreFileResolved = rootProject.file(relStoreFilePath)
def relStorePassword = signingProp('RELEASE_STORE_PASSWORD')
def relKeyAlias = signingProp('RELEASE_KEY_ALIAS')
def relKeyPassword = signingProp('RELEASE_KEY_PASSWORD') ?: relStorePassword
def hasReleaseSigning = relStoreFileResolved.exists() && relStorePassword && relKeyAlias

android {
  namespace 'com.reimei.intersect'
  compileSdk 36

  // 正式签名(必须在 buildTypes 之前声明,Groovy 是顺序执行的)
  signingConfigs {
    release {
      if (hasReleaseSigning) {
        storeFile relStoreFileResolved
        storePassword relStorePassword
        keyAlias relKeyAlias
        keyPassword relKeyPassword
      }
    }
  }

  defaultConfig {
    applicationId "com.reimei.intersect"
    minSdk 21
    targetSdk 30
    versionCode 2
    versionName "1.1"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    debug {
      // 测试版单独一个包名:com.reimei.intersect.beta,可以和正式版同时装在一台设备上。
      // 两套包名各自独立的私有数据(SharedPreferences / 数据库 / 文件),互不覆盖;
      // namespace 不变,源码里的 R 与包路径都不需要改。
      applicationIdSuffix '.beta'
      // 桌面图标的名字由 app/src/debug/res/values/strings.xml 覆盖成 intersect beta:
      // 两个包同时装着时,靠名字一眼分清哪个是测试版。
    }
    release {
      // 正式签名:密钥信息来自 local.properties(不入库),密钥文件为根目录 my-release.jks。
      // 注意:换成新密钥后,旧的 release 包无法覆盖安装,必须卸载重装(会清掉应用数据);
      // debug 包仍用 debug key,不受影响。
      // 未配置签名时回退 debug key,保证本地/CI 不被卡死,但不要用于分发。
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      } else {
        logger.warn("[signing] 未找到 release 签名配置,release 包将退回 debug 签名(不可用于分发):${relStoreFileResolved}")
        signingConfig signingConfigs.debug
      }
      // 上线包开混淆 + 资源裁剪:这个应用没有反射序列化(报文只用平台 org.json),
      // 暂时不需要额外的 keep 规则;将来引入 Gson/Moshi/kotlinx.serialization 必须补 proguard-rules.pro
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
  buildFeatures {
    compose true
  }
  lint {
    // targetSdk 30 是本工程的有意选择(预测性返回的分发行为依赖它,见 tools/similarity_scan.js 的结果),
    // 不是本次改动引入的疏漏。只关这一条,其余 lint 照旧拦截 release 构建。
    disable 'ExpiredTargetSdkVersion'
  }
}

dependencies {

  implementation 'androidx.core:core-ktx:1.10.0'
  implementation 'androidx.activity:activity-ktx:1.8.0'
  implementation 'androidx.activity:activity-compose:1.8.0'
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
  implementation "androidx.compose.foundation:foundation:1.5.4"
  implementation "androidx.compose.animation:animation:1.5.4"
  implementation "androidx.compose.foundation:foundation-layout:1.5.4"
  implementation "androidx.compose.material:material:1.5.4"
  implementation "androidx.compose.ui:ui:1.5.4"
  // 预览/布局检查器只在 debug 包里需要,不跟着 release 包发出去
  debugImplementation "androidx.compose.ui:ui-tooling:1.5.4"
  implementation "androidx.compose.ui:ui-util:1.5.4"
  implementation 'androidx.exifinterface:exifinterface:1.3.2'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
