plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

android {
  namespace 'com.reimei.intersect'
  compileSdk 36

  defaultConfig {
    applicationId "com.reimei.intersect"
    minSdk 21
    targetSdk 30
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      // 与 debug 用同一个密钥(~/.android/debug.keystore):
      // 这样 release 包能直接覆盖安装现有的测试包,不用卸载 —— 卸载会清掉应用数据。
      // 代价:debug key 签的包不能上架 Google Play,也不适合对外分发。
      // 该 keystore 已备份到 backup/keystore/,丢了就再也产不出能覆盖安装的包。
      signingConfig signingConfigs.debug
      // 上线包开混淆 + 资源裁剪:这个应用没有反射序列化(报文只用平台 org.json),
      // 暂时不需要额外的 keep 规则;将来引入 Gson/Moshi/kotlinx.serialization 必须补 proguard-rules.pro
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
  buildFeatures {
    compose true
  }
  lint {
    // targetSdk 30 是本工程的有意选择(预测性返回的分发行为依赖它,见 tools/similarity_scan.js 的结果),
    // 不是本次改动引入的疏漏。只关这一条,其余 lint 照旧拦截 release 构建。
    disable 'ExpiredTargetSdkVersion'
  }
}

dependencies {

  implementation 'androidx.core:core-ktx:1.10.0'
  implementation 'androidx.activity:activity-ktx:1.8.0'
  implementation 'androidx.activity:activity-compose:1.8.0'
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
  implementation "androidx.compose.foundation:foundation:1.5.4"
  implementation "androidx.compose.animation:animation:1.5.4"
  implementation "androidx.compose.foundation:foundation-layout:1.5.4"
  implementation "androidx.compose.material:material:1.5.4"
  implementation "androidx.compose.ui:ui:1.5.4"
  // 预览/布局检查器只在 debug 包里需要,不跟着 release 包发出去
  debugImplementation "androidx.compose.ui:ui-tooling:1.5.4"
  implementation "androidx.compose.ui:ui-util:1.5.4"
  implementation 'androidx.exifinterface:exifinterface:1.3.2'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
