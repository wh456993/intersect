name: Build

on:
  push:
    branches: [ main ]
    # 推 v* 标签会走同一条流水线,并在最后把正式签名 APK 发到 GitHub 发行版(Releases)。
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 默认只读;只有 release job 需要写权限(创建发行版、上传 APK),在 job 内单独声明。
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug APK
    # 打 tag 发版时只跑下面的正式版 job,不必再编一遍 debug 包(省 Actions 分钟数)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # gradle.properties 里有一条本机 AndroidIDE 专用的 aapt2 路径覆盖
      # (android.aapt2FromMavenOverride=/data/user/0/...),runner 上不存在,
      # 留着会让 aapt2 指向不存在的文件。只在 CI 里删掉,不改仓库内容。
      - name: 移除本机专属的 aapt2 路径覆盖
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 注意:这里刻意不用 android-actions/setup-android。
      # 它内部会安装早已从 SDK 仓库下线的 `tools` 包,新版 sdkmanager 报
      # "Failed to find package 'tools'" 并 exit 1,导致整条流水线在第一步就失败。
      # GitHub 的 ubuntu runner 镜像本身已预装 Android SDK,直接用它即可。
      - name: 定位并导出 Android SDK 路径
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到预装的 Android SDK: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"

      - name: 安装 compileSdk 36 所需的 SDK 组件
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 仓库里的 gradlew 没有可执行位,直接 ./gradlew 会 Permission denied
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: intersect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # 正式版(签名)构建。
  # 签名密钥不进仓库:keystore 以 base64 存进 Secret KEYSTORE_BASE64,
  # 构建时还原到 $RUNNER_TEMP,并通过 -P 参数传给 Gradle(build.gradle 支持
  # local.properties / -P / 环境变量 三种来源,CI 走 -P)。
  release:
    name: 构建正式版 APK
    # PR 来自 fork 时拿不到 Secret,跳过这个 job(跑也只会失败)。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 发布发行版要写仓库内容(GITHUB_TOKEN 默认只读)
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 移除本机专属的 aapt2 路径覆盖
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位并导出 Android SDK 路径
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到预装的 Android SDK: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"

      - name: 安装 compileSdk 36 所需的 SDK 组件
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 检查签名 Secret 是否已配置
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64。请在仓库 Settings → Secrets and variables → Actions 中添加:KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi

      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: 构建正式版 APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"

      # 关键校验:build.gradle 在拿不到签名时会静默回退 debug key,
      # 构建照样成功。所以这里必须用 apksigner 断言证书指纹,不能只看 BUILD SUCCESSFUL。
      # 注意:不能用 bash -e 裸赋值 CERTS=$(...)——apksigner 非零退出会直接中断且吞掉原因,
      # 所以先关掉 -e、打印真实输出与退出码,再判定。
      - name: 校验 APK 用的是正式签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK = $APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "未找到可执行的 apksigner,回退到 apksigner.jar"
            APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -type f 2>/dev/null | sort -V | tail -1)
            if [ -z "$APKSIGNER_JAR" ]; then
              echo "::warning::既没有 apksigner 也没有 apksigner.jar,跳过证书校验(仅提示,不判失败)"
              exit 0
            fi
            APKSIGNER="java -jar $APKSIGNER_JAR"
          fi
          echo "apksigner = $APKSIGNER"

          set +e
          CERTS=$($APKSIGNER verify --print-certs "$APK" 2>&1)
          RC=$?
          set -e
          echo "--- apksigner 输出 (rc=$RC) ---"
          echo "$CERTS"
          echo "--- 输出结束 ---"

          # 期望的证书指纹(与 my-release.jks 一致),比匹配 CN 更硬
          EXPECTED="c44d3c43cf0395cddb71a74547d3bfa37c5f347a293da5af6b815827c169fa4b"
          NORMALIZED=$(echo "$CERTS" | tr 'A-Z' 'a-z' | tr -d ':')
          if echo "$NORMALIZED" | grep -q "$EXPECTED"; then
            echo "✅ 正式签名校验通过: SHA-256 = $EXPECTED"
          else
            echo "::error::APK 不是正式签名(未匹配指纹 $EXPECTED)。请检查 Secrets 与 build.gradle 的读取链路"
            exit 1
          fi

      - name: 上传正式版 APK
        uses: actions/upload-artifact@v7
        with:
          name: intersect-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # 打 tag(v*)推送时,把上面校验过签名的 APK 挂到 GitHub 发行版。
      # 用 runner 预装的 gh CLI,不引第三方 action;凭据用自动注入的 GITHUB_TOKEN。
      # 注意必须在「校验正式签名」之后:没通过校验就不该有发行版。
      - name: 发布到 GitHub 发行版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          TAG="$GITHUB_REF_NAME"
          echo "发行版 tag = $TAG, APK = $APK"
          # 同一 tag 重复推送(或重跑)时发行版已存在,改成覆盖上传,避免直接报错退出
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "发行版 $TAG 已存在,覆盖上传 APK"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Intersect $TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release view "$TAG" --json url,name,assets --jq '.url, .name, (.assets[] | "\(.name)  \(.size) 字节")'

      # 密钥文件不留到 job 结束
      - name: 清理还原的密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
