name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # gradle.properties 里有一条本机 AndroidIDE 专用的 aapt2 路径覆盖
      # (android.aapt2FromMavenOverride=/data/user/0/...),runner 上不存在,
      # 留着会让 aapt2 指向不存在的文件。只在 CI 里删掉,不改仓库内容。
      - name: 移除本机专属的 aapt2 路径覆盖
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 注意:这里刻意不用 android-actions/setup-android。
      # 它内部会安装早已从 SDK 仓库下线的 `tools` 包,新版 sdkmanager 报
      # "Failed to find package 'tools'" 并 exit 1,导致整条流水线在第一步就失败。
      # GitHub 的 ubuntu runner 镜像本身已预装 Android SDK,直接用它即可。
      - name: 定位并导出 Android SDK 路径
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到预装的 Android SDK: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"

      - name: 安装 compileSdk 36 所需的 SDK 组件
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 仓库里的 gradlew 没有可执行位,直接 ./gradlew 会 Permission denied
      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: intersect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
